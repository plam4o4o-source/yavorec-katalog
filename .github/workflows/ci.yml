name: CI — тестове при всеки push/PR

# Фаза 3 от плана (сигурност/платформа): досега единственият workflow
# (release-electron.yml) се стартираше само при таг за издание — тестовете
# (npm test, 74 теста към момента) се пускаха само ако разработчикът се сети
# да ги пусне локално. Този workflow ги пуска автоматично при всеки push и
# pull request, независимо от клона — за да не се качи чупещ ред, без някой
# изобщо да е разбрал.

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

# ПОСЛЕДОВАТЕЛНИТЕ PUSH-ОВЕ НЕ СЕ ТРУПАТ.
# Докато се оправя един PR, се push-ва по няколко пъти в рамките на минути.
# Досега всяко от тези пускания вървеше до край — по ~6 минути на две машини,
# за да съобщи резултат за код, който вече е презаписан. Тук по-новото пускане
# отменя по-старото за СЪЩИЯ клон: остава само онова, което казва нещо за
# текущото състояние.
# ВАЖНО: cancel-in-progress е изключено за main. Там всяко пускане е за вече
# слят код и трябва да остави запис дали е минало — иначе бърза поредица от
# сливания би отменила проверката точно на публикувания клон.
# github.ref e различен за push (refs/heads/…) и за pull_request
# (refs/pull/N/merge), затова двете пускания на един и същ PR не се отменят
# взаимно; отменя се само по-старото пускане от същия вид.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # ДВЕТЕ ЧАСОВИ ЗОНИ ВЪРВЯТ УСПОРЕДНО, не една след друга.
    # Поредицата е ~8 минути в CI, а се пуска два пъти (виж защо при стъпката за
    # Europe/Sofia по-долу) — последователно това е ~18 минути чакане за всеки
    # push. Като матрица двете задачи текат едновременно и чакането пада до
    # времето на по-бавната. Минутите на runner-а остават горе-долу същите;
    # намалява само стенното време, тоест времето, в което човек чака.
    # fail-fast: false — ако едната зона падне, другата ТРЯБВА да се доизпълни.
    # Точно разликата между двете („минава в UTC, пада в София“ или обратното)
    # е първото, което казва дали дефектът е около лятното часово време, или е
    # трепкане от натоварване.
    name: Тестове (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tz: UTC
            label: utc
            primary: true
          # Одит v2.3.1 №3: тестовете за смяната на лятното часово време
          # (v2.3.0, addDays() в handlers/calendar.js и loans.js) имат
          # разграничителна сила САМО в часова зона, различна от UTC — под UTC
          # минават еднакво успешно както със, така и без дефекта, който
          # трябва да хващат. Runner-ите на GitHub работят в UTC, затова
          # поредицата се пуска втори път изрично в часовата зона на читалището.
          - tz: Europe/Sofia
            label: sofia
            primary: false
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Кеш на изтеглените пакети. package-lock.json не е в корена, а в
          # electron-app/, затова пътят се посочва изрично — иначе setup-node
          # не намира по какво да кешира и мълчаливо не кешира нищо.
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      # --ignore-scripts: package.json има postinstall
      # (electron-rebuild -f -w better-sqlite3), който прекомпилира
      # better-sqlite3 за ABI-то на Electron — и за целта СВАЛЯ самия Electron
      # (~100 MB). Това е нужно на пакетирания .exe (виж release-electron.yml),
      # но тук е чиста загуба: тестовете вървят с обикновен `node --test`, не
      # през Electron, и веднага след това следващата стъпка компилира модула
      # обратно за Node. Тоест досега CI сваляше Electron, компилираше за него
      # и хвърляше резултата.
      # Измерено в чиста папка само с package.json и package-lock.json:
      # `npm ci` → 86 s; `npm ci --ignore-scripts` + `npm rebuild better-sqlite3`
      # → 7 s. Спестява се в ДВЕТЕ задачи от матрицата.
      # --no-audit --no-fund само махат изход, който никой не чете.
      - name: Инсталиране на зависимости (без postinstall за Electron — виж защо горе)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # better-sqlite3 остава без компилиран двоичен файл след --ignore-scripts,
      # затова се компилира тук — за ТЕКУЩИЯ Node, какъвто искат тестовете.
      # Без него require() гърми с "NODE_MODULE_VERSION mismatch".
      - name: Компилиране на better-sqlite3 за обикновен Node (не Electron) — за самите тестове
        run: npm rebuild better-sqlite3

      # 265 файла, всеки в собствен процес на Node — почти цялото време отива в
      # стартиране на процеси, а не в разбор. xargs -P ги пуска по едно на ядро:
      # измерено локално 11,8 s → 4,3 s при същата проверка (`node --check`
      # остава непроменен). xargs връща 123, щом поне едно извикване е паднало,
      # а pipefail го изважда от конвейера — проверено с нарочно счупен файл.
      - name: Бърза синтактична проверка на всички .js файлове (извън node_modules)
        shell: bash
        run: |
          set -euo pipefail
          git ls-files '*.js' | grep -v 'node_modules/' | xargs -P "$(nproc)" -n 1 node --check

      # ПРОВЕРКА НА ТИПОВЕТЕ (tsc --checkJs, v2.4.68). Програмата си остава на
      # JavaScript — нищо не се компилира. TypeScript само чете кода и казва кога
      # изглед вика метод на window.api, който preload.js не излага, чете поле,
      # което елементът няма, или подава на функция грешен брой аргументи.
      # Описанието на window.api се извежда от preload.js
      # (scripts/gen-api-types.js) и тук се проверява и че е актуално.
      # Веднъж е достатъчно — часовата зона не влияе на типовете.
      - name: Проверка на типовете (tsc --checkJs — главен процес и изгледи)
        if: matrix.primary
        run: npm run typecheck

      - name: Тестове (node:test, ${{ matrix.tz }})
        shell: bash
        env:
          TZ: ${{ matrix.tz }}
        run: |
          set -o pipefail
          npm test | tee /tmp/test-${{ matrix.label }}.tap

      # ЧИСЛОТО В README Е ОБЕЩАНИЕ, КОЕТО НИКОЙ НЕ ПРОВЕРЯВАШЕ.
      # README казва „всички тестове (N+)“, а официалният сайт (invlib.com)
      # взима това число оттам — виж scripts/sync-release.mjs в хранилището
      # site-inventar. Дотук и двете страни остаряваха незабелязано и се
      # разминаха: README твърдеше 530+, сайтът 900+, а истината беше 1901.
      # Колко са тестовете знае само РЕАЛНОТО пускане (тест не може да
      # преброи сам себе си, а статичното броене на `test(` изпуска онези,
      # които се пораждат в цикъл — измерено 1862 срещу 1901), затова
      # проверката стои тук, върху изхода на поредицата.
      # Проверява се в двете посоки: обещанието не бива да е по-голямо от
      # истината (лъжа), но и не бива да изостава прекалено (остаряло).
      # Само в основната задача: числото е едно и също и в двете зони, а
      # проверката е мигновена — няма смисъл да се прави два пъти.
      - name: README обещава толкова тестове, колкото наистина има
        if: matrix.primary
        shell: bash
        run: |
          set -e
          real=$(grep -E '^# tests [0-9]+$' /tmp/test-${{ matrix.label }}.tap | tail -1 | awk '{print $3}')
          claim=$(grep -oE 'всички тестове \([0-9]+\+\)' ../README.md | grep -oE '[0-9]+' | head -1)
          if [ -z "$real" ] || [ -z "$claim" ]; then
            echo "Не можах да отчета числата: изпълнени='$real', обещани в README='$claim'."
            echo "Ако редът в README е преместен или преформулиран, обновете и тази проверка."
            exit 1
          fi
          echo "README обещава ${claim}+ теста, изпълнени са ${real}."
          if [ "$real" -lt "$claim" ]; then
            echo "README обещава повече тестове, отколкото програмата има. Поправете числото в README.md."
            exit 1
          fi
          if [ $((real - claim)) -ge 200 ]; then
            echo "README изостава с $((real - claim)) теста — вдигнете числото в README.md,"
            echo "защото официалният сайт го показва на посетителите."
            exit 1
          fi

      # КОЙ ТЕСТ ПАДНА — НА ВИДНО МЯСТО.
      # Поредицата е 1901 теста и изходът ѝ е към 15 000 реда. При провал
      # единственият начин да се разбере КОЙ е паднал беше да се изчете целият
      # лог — а той не се дава цял: API-то за логове връща само последните
      # няколко хиляди реда, а суровият файл стои в хранилище, до което не се
      # стига отвсякъде. Точно това се случи при едно трепкащо падане (PR #166,
      # 21.09.2026): падането беше истинско — „# pass 1900 · # fail 1“ — но кой
      # точно тест е бил, остана неизвестно, а повторното пускане мина.
      # Затова тук се изваждат САМО редовете „not ok“ с контекста им и се
      # слагат в резюмето на пускането, където се виждат без ровене в логове.
      - name: Кой тест падна (резюме)
        if: failure()
        shell: bash
        run: |
          set -u
          found=0
          for f in /tmp/test-utc.tap /tmp/test-sofia.tap; do
            [ -f "$f" ] || continue
            zone=$(basename "$f" .tap | sed 's/^test-//')
            n=$(grep -c '^not ok ' "$f" || true)
            # ВЪН от конвейера по-долу: `{ … } | tee` върви в ПОДОБВИВКА и
            # присвояване вътре в нея не се вижда тук. Първият вариант слагаше
            # found=1 вътре и после печаташе „нито един файл не съдържа not ok“
            # върху доклад с четири паднали теста.
            if [ "${n:-0}" -gt 0 ]; then found=1; fi
            {
              echo "### Паднали тестове — $zone: ${n:-0}"
              echo
              if [ "${n:-0}" -gt 0 ]; then
                echo '```'
                grep -A 25 '^not ok ' "$f" | head -300
                echo '```'
              else
                echo "_Няма паднал тест в този пробег — провалът е другаде в стъпката._"
              fi
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found" = "0" ]; then
            echo "Нито един TAP файл не съдържа „not ok“ — вижте пълния лог на стъпката."
          fi

      # Пълният TAP изход се пази като artifact. Името носи и часовата зона:
      # двете задачи от матрицата иначе биха качили артефакт с едно и също име,
      # а upload-artifact@v4 отказва при повторение — тоест диагностиката щеше
      # да се губи точно когато и двете зони падат.
      # Пълният TAP изход се пази като artifact: резюмето отгоре показва кой е
      # паднал, а тук остава целият контекст (реда на файловете, времената на
      # всеки тест), по който се познава дали е трепкане от натоварване.
      # Само при провал — при зелено пускане няма какво да се разследва.
      - name: Запазване на пълния TAP изход
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tap-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/test-*.tap
          retention-days: 14
          if-no-files-found: ignore

  # ПУБЛИЧНАТА КАТАЛОЖНА СТРАНИЦА — ОТДЕЛНА ЗАДАЧА, УСПОРЕДНО С ТЕСТОВЕТЕ.
  # Одит v2.4.14: `npm test` е `node --test` с working-directory: electron-app,
  # тоест откриването на тестове никога не излиза от electron-app/test/.
  # Поредицата за страницата минаваше, ако човек я пусне на ръка, но нищо нямаше
  # да съобщи, когато спре да минава — затова е в CI.
  # ЗАЩО ОТДЕЛНА ЗАДАЧА. Досега вървеше накрая на задачата в UTC и добавяше 52 s
  # право към времето, което човек чака. От тези 52 s само 3,5 s са сметки: почти
  # всичко е ИСТИНСКО изчакване на производствените срокове от page-katalog.html
  # (6 s за заглавките, 25 s за тялото, по веднъж за всеки от двата източника при
  # сценария „тялото виси“). Това чакане е самата проверка и не бива да се
  # съкращава — но няма причина да се чака ПОСЛЕ тестовете вместо ПО ВРЕМЕ на тях.
  # Тук не се пуска `npm rebuild better-sqlite3`: страницата ползва само jsdom.
  # Часовата зона е без значение за каталожната страница — пуска се веднъж.
  site:
    name: Публична каталожна страница (site/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      # jsdom е зависимост на electron-app и е чист JavaScript — нито постинсталация,
      # нито компилиране. Затова само изтегляне.
      - name: Инсталиране на jsdom (зависимост на electron-app)
        working-directory: electron-app
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Как каталогът СТИГА до страницата: и двата източника паднали + кеш →
      # видимо предупреждение за остарели данни; повреден кеш → връщане към
      # статичния списък; висящо тяло на отговора → прекъсване по време.
      - name: Източници, срокове, кеш и диагностика
        working-directory: site
        env:
          NODE_PATH: ../electron-app/node_modules
        run: node test-page-katalog.js page-katalog.html

      # Какво прави страницата, СЛЕД като данните са дошли — при 15 000
      # екземпляра, колкото е реален фонд. Този файл съществуваше от v2.4.x, но
      # НИЩО не го пускаше автоматично: нито `npm test` (извън electron-app/),
      # нито CI. Минаваше само когато някой се сети на ръка.
      - name: Изгледът при реален мащаб (15 000 екземпляра)
        working-directory: site
        env:
          NODE_PATH: ../electron-app/node_modules
        run: node test-page-katalog-view.js
