name: VirusTotal Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Download latest GitHub Release EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release

          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.exe" \
            --dir release

          ls -lh release

      - name: Find EXE
        id: find_exe
        run: |
          EXE=$(find release -type f -iname "*.exe" | head -n 1)

          if [ -z "$EXE" ]; then
            echo "No EXE file found."
            exit 1
          fi

          echo "Found: $EXE"
          echo "file=$EXE" >> "$GITHUB_OUTPUT"

      - name: Calculate SHA-256
        id: hash
        run: |
          EXE="${{ steps.find_exe.outputs.file }}"
          SHA256=$(sha256sum "$EXE" | awk '{print $1}')

          echo "SHA-256: $SHA256"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Check VirusTotal
        id: check
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          HTTP_CODE=$(curl \
            --silent \
            --output vt-existing.json \
            --write-out "%{http_code}" \
            --header "x-apikey: $VT_API_KEY" \
            "https://www.virustotal.com/api/v3/files/$SHA256")

          echo "VirusTotal HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "File already exists in VirusTotal."

          elif [ "$HTTP_CODE" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "File not found. Uploading."

          else
            echo "VirusTotal returned HTTP $HTTP_CODE"
            cat vt-existing.json
            exit 1
          fi

      - name: Get upload URL
        id: upload_url
        if: steps.check.outputs.exists != 'true'
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          URL=$(curl \
            --fail \
            --silent \
            --header "x-apikey: $VT_API_KEY" \
            "https://www.virustotal.com/api/v3/files/upload_url" \
            | python -c "import sys,json; print(json.load(sys.stdin)['data'])")

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Upload EXE
        id: upload
        if: steps.check.outputs.exists != 'true'
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          UPLOAD_URL: ${{ steps.upload_url.outputs.url }}
          EXE_FILE: ${{ steps.find_exe.outputs.file }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --url "$UPLOAD_URL" \
            --header "x-apikey: $VT_API_KEY" \
            --form "file=@$EXE_FILE" \
            --output vt-upload.json

          cat vt-upload.json

          ANALYSIS_ID=$(python -c "import json; print(json.load(open('vt-upload.json'))['data']['id'])")

          echo "analysis_id=$ANALYSIS_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for VirusTotal analysis
        id: analysis
        if: steps.check.outputs.exists != 'true'
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          ANALYSIS_ID: ${{ steps.upload.outputs.analysis_id }}
        run: |
          for i in {1..40}; do

            RESPONSE=$(curl \
              --fail \
              --silent \
              --header "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID")

            STATUS=$(echo "$RESPONSE" | python -c \
              "import sys,json; print(json.load(sys.stdin)['data']['attributes']['status'])")

            echo "Attempt $i - status: $STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "$RESPONSE" > analysis.json
              break
            fi

            sleep 15
          done

          if [ ! -f analysis.json ]; then
            echo "VirusTotal analysis did not complete."
            exit 1
          fi

      - name: Get existing file information
        if: steps.check.outputs.exists == 'true'
        run: |
          cp vt-existing.json analysis.json

      - name: Show VirusTotal result
        env:
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          python - <<'PY'
          import json

          data = json.load(open("analysis.json"))
          attrs = data["data"]["attributes"]

          stats = attrs.get("stats") or attrs.get("last_analysis_stats") or {}

          print("")
          print("========================================")
          print("        VIRUSTOTAL RESULT")
          print("========================================")
          print("")
          print("SHA-256:")
          print(data["data"].get("id", "${SHA256}"))
          print("")
          print("Malicious:  ", stats.get("malicious", 0))
          print("Suspicious: ", stats.get("suspicious", 0))
          print("Harmless:   ", stats.get("harmless", 0))
          print("Undetected: ", stats.get("undetected", 0))
          print("")
          print("VirusTotal:")
          print("https://www.virustotal.com/gui/file/${SHA256}")
          print("")
          print("========================================")
          PY
