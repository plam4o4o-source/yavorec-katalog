name: VirusTotal Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Download latest GitHub Release EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release

          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.exe" \
            --dir release

          echo "Downloaded files:"
          ls -lh release

      - name: Find EXE
        id: find_exe
        shell: bash
        run: |
          EXE=$(find release -type f -iname "*.exe" | head -n 1)

          if [ -z "$EXE" ]; then
            echo "No EXE file found."
            exit 1
          fi

          echo "Found: $EXE"
          echo "file=$EXE" >> "$GITHUB_OUTPUT"

      - name: Calculate SHA-256
        id: hash
        shell: bash
        run: |
          EXE="${{ steps.find_exe.outputs.file }}"
          SHA256=$(sha256sum "$EXE" | awk '{print $1}')

          echo "SHA-256: $SHA256"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Check VirusTotal for existing file
        id: check
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        shell: bash
        run: |
          HTTP_CODE=$(curl \
            --silent \
            --output vt-existing.json \
            --write-out "%{http_code}" \
            --header "x-apikey: $VT_API_KEY" \
            "https://www.virustotal.com/api/v3/files/$SHA256")

          echo "VirusTotal HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "File already exists in VirusTotal."
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "File not found in VirusTotal. It will be uploaded."
          else
            echo "VirusTotal returned HTTP $HTTP_CODE"
            cat vt-existing.json
            exit 1
          fi

      - name: Get VirusTotal upload URL
        id: vt_url
        if: steps.check.outputs.exists != 'true'
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        shell: bash
        run: |
          UPLOAD_URL=$(curl \
            --fail \
            --silent \
            --header "x-apikey: $VT_API_KEY" \
            https://www.virustotal.com/api/v3/files/upload_url \
            | python -c "import sys,json; print(json.load(sys.stdin)['data'])")

          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload EXE to VirusTotal
        id: upload
        if: steps.check.outputs.exists != 'true'
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          UPLOAD_URL: ${{ steps.vt_url.outputs.upload_url }}
          EXE_FILE: ${{ steps.find_exe.outputs.file }}
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --url "$UPLOAD_URL" \
            --header "x-apikey: $VT_API_KEY" \
            --form "file=@$EXE_FILE" \
            --output vt-result.json

          cat vt-result.json

          ANALYSIS_ID=$(python -c "import json; print(json.load(open('vt-result.json'))['data']['id'])")

          echo "analysis_id=$ANALYSIS_ID" >> "$GITHUB_OUTPUT"

      - name: Get existing analysis ID
        id: existing
        if: steps.check.outputs.exists == 'true'
        env:
          SHA256: ${{ steps.hash.outputs.sha256 }}
        shell: bash
        run: |
          python - <<'PY'
          import json

          data = json.load(open("vt-existing.json"))
          print("Existing VirusTotal file found.")
          print("SHA-256:", data["data"]["id"])
          PY

          echo "analysis_id=" >> "$GITHUB_OUTPUT"

      - name: Show VirusTotal file result
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --header "x-apikey: $VT_API_KEY" \
            "https://www.virustotal.com/api/v3/files/$SHA256" \
            --output file-report.json

          python - <<'PY'
          import json

          data = json.load(open("file-report.json"))
          attr = data["data"]["attributes"]

          stats = attr.get("last_analysis_stats", {})

          print("=================================")
          print("VirusTotal Result")
          print("=================================")
          print("SHA-256:", data["data"]["id"])
          print("Malicious:", stats.get("malicious", 0))
          print("Suspicious:", stats.get("suspicious", 0))
          print("Harmless:", stats.get("harmless", 0))
          print("Undetected:", stats.get("undetected", 0))
          print("")
          print("VirusTotal:")
          print("https://www.virustotal.com/gui/file/" + data["data"]["id"])
          PY
