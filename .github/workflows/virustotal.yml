name: VirusTotal Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Download latest GitHub Release EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.exe" \
            --dir release

          echo "Downloaded files:"
          ls -lh release

      - name: Find EXE
        id: find_exe
        shell: bash
        run: |
          EXE=$(find release -type f -iname "*.exe" | head -n 1)

          if [ -z "$EXE" ]; then
            echo "No EXE file found in the latest release."
            exit 1
          fi

          echo "Found: $EXE"
          echo "file=$EXE" >> "$GITHUB_OUTPUT"

      - name: Get VirusTotal upload URL
        id: vt_url
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        shell: bash
        run: |
          UPLOAD_URL=$(curl --fail --silent \
            --header "x-apikey: $VT_API_KEY" \
            https://www.virustotal.com/api/v3/files/upload_url \
            | python -c "import sys,json; print(json.load(sys.stdin)['data'])")

          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload EXE to VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          UPLOAD_URL: ${{ steps.vt_url.outputs.upload_url }}
          EXE_FILE: ${{ steps.find_exe.outputs.file }}
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --url "$UPLOAD_URL" \
            --header "x-apikey: $VT_API_KEY" \
            --form "file=@$EXE_FILE" \
            --output vt-result.json

          echo "VirusTotal response:"
          cat vt-result.json
