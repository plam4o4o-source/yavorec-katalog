name: VirusTotal Scan

on:
  workflow_dispatch:

  # NOT "release: published". Releasing creates the release BEFORE
  # electron-builder uploads the files into it: measured across three releases,
  # the .exe appears 67, 73 and 83 seconds AFTER publication, so a run started
  # then finds nothing to scan and fails on "No EXE file found". Waiting for the
  # build workflow to finish means the assets are already there.
  workflow_run:
    workflows: ["Build & publish Windows installer"]
    types: [completed]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # A failed build has nothing worth scanning.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # The tag is resolved ONCE and everything below refers to it: downloading
      # "the latest release" and then editing "the latest release" separately
      # could touch two different releases if another one appears in between.
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName')

          if [ -z "$TAG" ]; then
            echo "ERROR: No release found."
            exit 1
          fi

          echo "Release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download GitHub Release EXE
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p release

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.exe" \
            --dir release

          ls -lh release

      - name: Find EXE
        id: find_exe
        run: |
          EXE=$(find release -type f -iname "*.exe" | head -n 1)

          if [ -z "$EXE" ]; then
            echo "ERROR: No EXE file found."
            exit 1
          fi

          echo "Found EXE: $EXE"
          echo "file=$EXE" >> "$GITHUB_OUTPUT"

      - name: Calculate SHA-256
        id: hash
        run: |
          EXE="${{ steps.find_exe.outputs.file }}"
          SHA256=$(sha256sum "$EXE" | awk '{print $1}')

          echo "SHA-256: $SHA256"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Check VirusTotal
        id: check
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          HTTP_CODE=$(curl \
            --silent \
            --output vt-existing.json \
            --write-out "%{http_code}" \
            --header "x-apikey: $VT_API_KEY" \
            "https://www.virustotal.com/api/v3/files/$SHA256")

          echo "VirusTotal HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "File already exists in VirusTotal."

          elif [ "$HTTP_CODE" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "File not found. Uploading."

          else
            echo "VirusTotal returned HTTP $HTTP_CODE"
            cat vt-existing.json
            exit 1
          fi

      - name: Get VirusTotal upload URL
        id: upload_url
        if: steps.check.outputs.exists != 'true'
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          URL=$(curl \
            --fail \
            --silent \
            --header "x-apikey: $VT_API_KEY" \
            "https://www.virustotal.com/api/v3/files/upload_url" \
            | python -c "import sys,json; print(json.load(sys.stdin)['data'])")

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Upload EXE to VirusTotal
        id: upload
        if: steps.check.outputs.exists != 'true'
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          UPLOAD_URL: ${{ steps.upload_url.outputs.url }}
          EXE_FILE: ${{ steps.find_exe.outputs.file }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --url "$UPLOAD_URL" \
            --header "x-apikey: $VT_API_KEY" \
            --form "file=@$EXE_FILE" \
            --output vt-upload.json

          cat vt-upload.json

          ANALYSIS_ID=$(python -c \
            "import json; print(json.load(open('vt-upload.json'))['data']['id'])")

          echo "analysis_id=$ANALYSIS_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for VirusTotal analysis
        if: steps.check.outputs.exists != 'true'
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          ANALYSIS_ID: ${{ steps.upload.outputs.analysis_id }}
        run: |
          for i in {1..40}; do

            RESPONSE=$(curl \
              --fail \
              --silent \
              --header "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID")

            STATUS=$(echo "$RESPONSE" | python -c \
              "import sys,json; print(json.load(sys.stdin)['data']['attributes']['status'])")

            echo "Attempt $i - status: $STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "$RESPONSE" > analysis.json
              break
            fi

            sleep 15
          done

          if [ ! -f analysis.json ]; then
            echo "ERROR: VirusTotal analysis did not complete."
            exit 1
          fi

      - name: Get existing VirusTotal file information
        if: steps.check.outputs.exists == 'true'
        run: |
          cp vt-existing.json analysis.json

      - name: Create VirusTotal report
        id: report
        env:
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          python - <<'PY'
          import json
          import os

          with open("analysis.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          attrs = data["data"]["attributes"]

          stats = (
              attrs.get("stats")
              or attrs.get("last_analysis_stats")
              or {}
          )

          sha256 = os.environ["SHA256"]

          malicious = stats.get("malicious", 0)
          suspicious = stats.get("suspicious", 0)
          harmless = stats.get("harmless", 0)
          undetected = stats.get("undetected", 0)

          lines = [
              "## 🛡️ VirusTotal Scan",
              "",
              "**Status:** ✅ Successfully scanned",
              "",
              "| Result | Count |",
              "|---|---:|",
              f"| 🔴 Malicious | {malicious} |",
              f"| 🟠 Suspicious | {suspicious} |",
              f"| 🟢 Harmless | {harmless} |",
              f"| ⚪ Undetected | {undetected} |",
              "",
              "**SHA-256**",
              "",
              f"`{sha256}`",
              "",
              "**VirusTotal**",
              "",
              f"https://www.virustotal.com/gui/file/{sha256}",
              "",
              "_This VirusTotal scan was performed automatically by GitHub Actions._",
          ]

          report = "\n".join(lines) + "\n"

          print(report)

          with open("virustotal-report.md", "w", encoding="utf-8") as f:
              f.write(report)

          with open("scan-results.txt", "w", encoding="utf-8") as f:
              f.write("VirusTotal Scan: SUCCESS\n")
              f.write(f"SHA-256: {sha256}\n")
              f.write(f"Malicious: {malicious}\n")
              f.write(f"Suspicious: {suspicious}\n")
              f.write(f"Harmless: {harmless}\n")
              f.write(f"Undetected: {undetected}\n")
              f.write(f"VirusTotal: https://www.virustotal.com/gui/file/{sha256}\n")
          PY

      - name: Show VirusTotal result
        run: |
          cat virustotal-report.md

      # Runs for both triggers now: the tag comes from the step above, not from
      # a release event that no longer starts this workflow.
      - name: Publish VirusTotal result to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body' > current-notes.md

          cat virustotal-report.md >> current-notes.md

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file current-notes.md

          echo "GitHub Release updated successfully."

      - name: Upload scan report as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirusTotal-Report
          path: |
            virustotal-report.md
            scan-results.txt

      - name: Complete
        run: |
          echo "========================================"
          echo "VirusTotal scan completed successfully"
          echo "========================================"
