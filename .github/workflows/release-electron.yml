name: Build & publish Windows installer

# Стартира се автоматично при качване на таг във формат vX.Y.Z (напр. v1.2.0),
# или ръчно от раздел "Actions" в GitHub (workflow_dispatch). Строи .exe
# инсталатора на истинска Windows машина (GitHub-hosted runner — не е нужен
# wine) и публикува GitHub Release с трите файла (.exe, .exe.blockmap,
# latest.yml), които electron-updater очаква за автоматичното обновяване.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Изданията тук се пускат по установения ред чрез "Actions" →
      # workflow_dispatch на main (виж README/CONTRIBUTING), не чрез директно
      # качване на таг — electron-builder сам създава тага и release-а през
      # GitHub API при "--publish always". При workflow_dispatch GITHUB_REF_NAME
      # е името на branch-а ("main"), НЕ версията — стъпка, разчитаща на него
      # за да намери/адресира release-а, мълчаливо не намира нищо и се
      # пропуска (точно това се случи с описанието от CHANGELOG.md на всяко
      # издание досега). RELEASE_TAG се извежда директно от package.json и е
      # верен при двата начина на пускане.
      - name: Определя тага на изданието (от package.json — верен и при ръчно пускане)
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Таг на изданието: $tag"

      # Разделът "## vX.Y.Z" от CHANGELOG.md се извлича ВЕДНЪЖ, в файл, и се
      # ползва на две места: при предварителното създаване на release-а и при
      # опресняването на описанието накрая. Липсващ раздел не проваля нищо —
      # файлът просто остава празен и стъпките по-долу го пропускат.
      - name: Извлича раздела на изданието от CHANGELOG.md
        shell: pwsh
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notes -Value '' -Encoding utf8
          "RELEASE_NOTES_FILE=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Test-Path 'CHANGELOG.md')) { Write-Host 'Няма CHANGELOG.md.'; exit 0 }
          $lines = Get-Content 'CHANGELOG.md'
          $hit = $lines | Select-String -Pattern "^## $([regex]::Escape($env:RELEASE_TAG))(\s|$)"
          if (-not $hit) { Write-Host "Няма раздел за $env:RELEASE_TAG в CHANGELOG.md."; exit 0 }
          $startIdx = $hit[0].LineNumber
          $endIdx = $lines.Length - 1
          for ($i = $startIdx; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match '^## ') { $endIdx = $i - 1; break }
          }
          $section = ($lines[$startIdx..$endIdx] -join "`n").Trim()
          Set-Content -Path $notes -Value $section -Encoding utf8
          Write-Host "Разделът за $env:RELEASE_TAG е $($section.Length) знака."

      # Release-ът се създава ТУК, ПРЕДИ electron-builder — с точно една цел:
      # electron-builder да го НАМЕРИ, а не да го създава. v2.4.26 (run #115)
      # показа защо: publisher-ът качва .exe и .blockmap паралелно, всяка от
      # двете задачи провери „release-ът съществува ли“ в един и същи миг, и
      # двете видяха „не“ и двете го създадоха — GitHub пусна ДВА издадени
      # release-а с един и същ таг (id 382736872 и 382736873), файловете се
      # разпределиха между тях (.blockmap в единия, .exe и latest.yml в
      # другия), описанието остана празно, а стъпката за описанието падна с
      # „tag_name already_exists“. Auto-updater-ът чете latest.yml от
      # „последния“ release — при два такива кой е „последният“ е въпрос на
      # късмет. При вече съществуващ ЕДИН release нищо не се пипа (повторно
      # пускане след частичен провал — electron-builder презаписва файловете
      # в него). При повече от един — всички са продукт на надпреварата и по
      # построение непълни: изтриват се и се създава един чист. Изтриването
      # на release НЕ трие git тага; `--target` слага тага на строения commit.
      - name: Подготвя release-а предварително (един, преди electron-builder)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $repo = $env:GITHUB_REPOSITORY
          # Само първата страница (най-новите 100): строи се винаги най-новата
          # версия, тоест и нейните евентуални дубликати са най-отгоре. Без
          # jq-филтър — той би носил кавички и „\(“, чието прехвърляне от
          # PowerShell към gh.exe е точно мястото за тиха грешка.
          $json = gh api "repos/$repo/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $same = @((($json -join "`n") | ConvertFrom-Json) | Where-Object { $_.tag_name -eq $tag })
          Write-Host "Release-и с таг ${tag}: $($same.Count)"
          if ($same.Count -gt 1) {
            foreach ($r in $same) {
              Write-Host "Изтрива дублиран release id=$($r.id) (файлове: $($r.assets.Count))"
              gh api -X DELETE "repos/$repo/releases/$($r.id)" | Out-Null
              if ($LASTEXITCODE -ne 0) { exit 1 }
            }
            $same = @()
          }
          if ($same.Count -eq 1) { Write-Host 'Release-ът вече съществува — ще бъде допълнен.'; exit 0 }
          # Празният файл с бележки също минава — описанието се допълва накрая.
          gh release create $tag --repo $repo --title $tag.TrimStart('v') `
            --target $env:GITHUB_SHA --notes-file $env:RELEASE_NOTES_FILE
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Създаден е release $tag — electron-builder ще качи файловете в него."

      # Цифровият подпис се включва сам, щом в хранилището бъдат добавени двете
      # секретни променливи (Settings → Secrets and variables → Actions):
      #   WINDOWS_CERT_BASE64   — .pfx файлът на сертификата, кодиран в base64
      #   WINDOWS_CERT_PASSWORD — паролата на .pfx файла
      #
      # CSC_LINK се задава само когато сертификатът наистина съществува. Липсващ
      # secret в GitHub идва като празен низ, а electron-builder приема празния
      # низ за път до файл и спира build-а с "not a file" — затова променливата
      # се пише в GITHUB_ENV само в клона с наличен сертификат.
      - name: Подготвя сертификата за подпис (ако има такъв)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_B64)) {
            Write-Host 'Няма сертификат — инсталаторът ще бъде НЕПОДПИСАН.'
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP 'inventar-cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
            "CSC_LINK=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host 'Сертификатът е зареден — инсталаторът ще бъде подписан.'
          }

      # GitHub понякога връща "422 Published releases must have a valid tag" при
      # СЪЗДАВАНЕ на нов release+таг едновременно (v1.24.0 се провали точно така) —
      # временна нестабилност в API-то, потвърдена и от отворени issue-та на
      # electron-builder. Компилацията/подписването вече са минали дотук; само
      # публикуването във втория опит гърми. Затова се повтаря целият build, а не
      # само публикуването — electron-builder презаписва вече качените assets при
      # повторен опит без грешка, а изчистването на dist/ гарантира чист старт.
      - name: Build and publish release (с повторен опит при временна грешка на GitHub)
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Опит $attempt от $maxAttempts…"
            npm run build -- --publish always $env:SIGN_ARG
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              $delay = 15 * $attempt
              Write-Host "Неуспешно — изчакване $delay сек. преди следващия опит…"
              Start-Sleep -Seconds $delay
              if (Test-Path dist) { Remove-Item -Recurse -Force dist }
            }
          }
          Write-Host "Всичките $maxAttempts опита се провалиха."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Показва дали инсталаторът е подписан
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $exe) { Write-Host 'няма .exe файл'; exit 0 }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Файл:    $($exe.Name)"
          Write-Host "Подпис:  $($sig.Status)"
          if ($sig.SignerCertificate) {
            Write-Host "Издаден на: $($sig.SignerCertificate.Subject)"
          } else {
            Write-Host 'Инсталаторът е НЕПОДПИСАН — виж README, раздел „Цифров подпис“.'
          }

      # SHA-256 контролни суми на публикуваните файлове, качени като
      # SHA256SUMS.txt в самия release. Две ползи, и двете свързани с това, че
      # инсталаторът е неподписан: (1) в доклад за фалшива тревога до
      # антивирусна компания (AVG/Avast и др. — виж README, раздел „Цифров
      # подпис и антивирусни програми“) сумата идентифицира еднозначно точния
      # файл; (2) библиотекар може да провери, че изтегленият инсталатор е
      # байт по байт публикуваният (PowerShell: Get-FileHash <файл>).
      # Работи и при workflow_dispatch — виж коментара при стъпката, която
      # определя RELEASE_TAG. Вътрешната проверка за празен dist/ пази
      # стъпката безопасна, ако build-ът по някаква причина не е оставил
      # файлове (не би трябвало да се стигне дотук в такъв случай).
      - name: Публикува SHA-256 суми в release-а
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' }
          if (-not $files) { Write-Host 'Няма файлове в dist/ — пропуска се.'; exit 0 }
          $lines = foreach ($f in $files) {
            $h = Get-FileHash $f.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($f.Name)"
          }
          $out = Join-Path dist 'SHA256SUMS.txt'
          $lines | Out-File -FilePath $out -Encoding ascii
          Get-Content $out
          gh release upload $env:RELEASE_TAG $out --clobber --repo $env:GITHUB_REPOSITORY

      # Опреснява описанието от CHANGELOG.md и при повторно пускане върху вече
      # съществуващ release (тогава предварителната стъпка не го е създала и
      # не му е дала бележки). Разделът е извлечен по-горе; празен файл =
      # няма какво да се пише. Работи през `gh release edit`, а не през суров
      # REST PATCH — той гърмеше с „tag_name already_exists“ при дублирани
      # release-и, което вече е невъзможно след предварителната стъпка.
      - name: Опреснява описанието на изданието от CHANGELOG.md
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ((Get-Item $env:RELEASE_NOTES_FILE).Length -eq 0) { Write-Host 'Няма раздел в CHANGELOG.md — пропуска се.'; exit 0 }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --notes-file $env:RELEASE_NOTES_FILE
          Write-Host 'Описанието на изданието е обновено от CHANGELOG.md.'
