var STATIC=[{"inv":1,"a":"Вазова, Вера","t":"Иван Вазов и неговите близки","s":"Спомени","c":"София","p":"F.P.A","y":"1994","v":"книга","l":"български","u":"886.7(092)(093.3)","g":"886.7/Г 13","o":"за възрастни","k":"","n":"Писма Стихотворения от Иван Вазов и посветени на поета","cv":"","av":1},{"inv":2,"a":"Габе, Дора Петрова; Шишкова, Магдалена","t":"Светът е тайна","s":"Поезия & проза","c":"София","p":"Унив. изд. Св. Климент Охридски","y":"1994","v":"книга","l":"български","u":"886.7-8","g":"886.7/Г 13","o":"за възрастни","k":"","n":"","cv":"","av":1},{"inv":3,"a":"Славейков, Пенчо","t":"На острова на блаженните","s":"Антология","c":"София","p":"Хемус","y":"1949","v":"книга","l":"български","u":"886.7-1","g":"886.7/С 42","o":"за възрастни","k":"","n":"","cv":"","av":1}], STATIC_GEN="25.07.2026";
var LIVE_URL="https://raw.githubusercontent.com/plam4o4o-source/yavorec-katalog/main/katalog.json";
/* Каталогът вече идва от GitHub, качван автоматично от библиотечния компютър.
   raw.githubusercontent.com изпраща правилното CORS заглавие сам по себе си —
   не са нужни чужди прокита или заобикалки, каквито изискваше OneDrive.
   jsDelivr е добавен само като независим резервен път (различна инфраструктура),
   в случай че GitHub временно има проблем. */
var SOURCES=[
  {url:LIVE_URL,label:'GitHub'},
  {url:'https://cdn.jsdelivr.net/gh/plam4o4o-source/yavorec-katalog@main/katalog.json',label:'jsDelivr (резервен път)'}
];
var FT_BASE="Народно читалище „Васил Левски – 1922\" · с. Яворец, общ. Габрово";
/* Дискретен кредит на софтуера — винаги последен ред във футъра, независимо
   дали finish() е успял да сложи датата на актуалност (виж по-долу). */
var FT_POWEREDBY='<br><span class="kat-poweredby">Библиотечен софтуер: InvLib</span>';
var D=[],P=0,R=[],LOG=[];
/* Търсене по думи + подредба + състояние в адреса (за споделяеми връзки).
   QW — думите от текущото търсене (за открояване); SORT — избраната
   подредба; ZAPIS — инв. № от споделена връзка (#zapis=…), който да се
   разгъне и покаже при зареждане; PENDF/PENDO — филтри от адреса, които се
   прилагат чак след като setupDynamic() построи списъците от самите данни. */
var QW=[],SORT='',ZAPIS=null,PENDF='',PENDO='';
function readHash(){
  try{
    var p=new URLSearchParams((location.hash||'').slice(1));
    if(p.get('q'))document.getElementById('katQ').value=p.get('q');
    PENDF=p.get('vid')||''; PENDO=p.get('otdel')||'';
    SORT=p.get('podredba')||''; SHELF=p.get('vitrina')||''; ZAPIS=p.get('zapis');
  }catch(e){}
}
function writeHash(){
  try{
    var p=new URLSearchParams();
    var q=document.getElementById('katQ').value.trim();
    var f=document.getElementById('katF').value,o=document.getElementById('katO').value;
    if(q)p.set('q',q); if(f)p.set('vid',f); if(o)p.set('otdel',o);
    if(SORT)p.set('podredba',SORT); if(SHELF)p.set('vitrina',SHELF);
    var h=p.toString();
    history.replaceState(null,'',h?'#'+h:location.pathname+location.search);
  }catch(e){}
}
/* Витрини и нови постъпления. SHELVES идва от katalog.json (по избор на библиотекаря);
   „Нови постъпления" се извежда тук от датата на постъпване (поле d на всеки запис,
   добавено от програмата „InvLib"). Стар katalog.json без тези полета работи без
   промяна — лентата с витрини просто не се показва. */
var SHELVES=[],SHELF='',NEW_SET=null,NEW_DAYS=60;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function showLoading(){
  document.getElementById('katC').textContent='';
  var spines='';
  for(var i=0;i<7;i++) spines+='<div class="kat-spine"></div>';
  var skelRow='<div class="kat-skel-row"><div class="kat-skel-cover"></div><div class="kat-skel-lines">'+
    '<div class="kat-skel-line w70"></div><div class="kat-skel-line w45"></div><div class="kat-skel-line w60"></div></div></div>';
  document.getElementById('katR').innerHTML=
    '<div class="kat-loading">'+
      '<div class="kat-shelf">'+spines+'</div>'+
      '<div class="kat-loading-txt">Разгръщаме каталога<span class="kat-dots"><span>.</span><span>.</span><span>.</span></span></div>'+
    '</div>'+
    skelRow+skelRow+skelRow;
}
/* fetch с таймаут — при мълчаливо увиснала връзка (вместо изрична грешка) не се чака безкрайно.

   ВАЖНО за реда на изчистване: fetch() се решава още при ПРИСТИГАНЕТО НА
   ЗАГЛАВКИТЕ, докато тялото се чете чак след това с .json(). Дотук таймерът се
   гасеше в .finally() на самия fetch — тоест точно преди дългата част. Сървър,
   който отговори веднага с „200 OK“ и след това спре да подава байтове (падаща
   мрежа, прекъснат мобилен интернет, задавен CDN възел), оставяше страницата да
   виси на анимацията „Разгръщаме каталога…“ БЕЗКРАЙНО: резервният източник не се
   пробваше, кешът не се пробваше, съобщение нямаше.

   Затова таймерът се гаси чак когато ЦЯЛОТО тяло е прочетено — четенето вече е
   тук, вътре във функцията, а не при извикващия. Връща се готовият JSON.

   ДВА РАЗЛИЧНИ СРОКА, а не един: katalog.json е над 1 MB, а страницата се отваря
   и от селски мобилен интернет. Ако единственият срок покриваше и тялото, всяко
   бавно, но напълно РАБОТЕЩО изтегляне щеше да бъде прекъснато и читателят щеше
   да получи трите вградени демо записа вместо каталога — тоест щяхме да сменим
   рядко увисване с чест грешен резултат. Затова:
     headMs — колко чакаме СЪРВЪРЪТ да се обади (мъртъв източник се хваща бързо);
     bodyMs — колко му даваме да достави файла, след като вече се е обадил. */
function fetchJsonTimeout(url,headMs,bodyMs){
  var ctl=('AbortController' in window)?new AbortController():null;
  var t=ctl?setTimeout(function(){ctl.abort();},headMs):null;
  return fetch(url,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){
    /* Заглавките дойдоха — сървърът е жив. Срокът се пренавива за тялото, но НЕ
       се маха: точно това беше бъгът. */
    if(t)clearTimeout(t);
    if(ctl)t=setTimeout(function(){ctl.abort();},bodyMs);
    if(!r.ok){ var e=new Error('HTTP '+r.status); e.httpStatus=r.status; throw e; }
    return r.json();
  }).finally(function(){ if(t)clearTimeout(t); });
}
async function loadLive(){
  LOG=[];
  for(var i=0;i<SOURCES.length;i++){
    var src=SOURCES[i], entry={label:src.label,ok:false,detail:''};
    try{
      /* 6 сек. да се обади сървърът, после 25 сек. за самия файл (>1 MB). */
      var j=await fetchJsonTimeout(src.url,6000,25000);
      if(j&&j.items){ entry.ok=true; entry.detail=j.items.length+' записа'; LOG.push(entry);
        try{ localStorage.setItem('katalog_cache',JSON.stringify(j)); }catch(e2){}
        return j;
      }
      entry.detail='отговорът не съдържа "items" (вероятно вход в OneDrive вместо самия файл)';
      LOG.push(entry);
    }catch(e){
      entry.detail=(e&&e.name==='AbortError')?'изтече времето за изчакване':
        (e&&e.httpStatus)?('HTTP '+e.httpStatus):
        'мрежова/CORS грешка'+(e&&e.message?': '+e.message:'');
      LOG.push(entry);
    }
    console.warn('[каталог] неуспешен източник — '+src.label+': '+entry.detail);
  }
  /* И двата живи източника паднаха — резервният вариант е локалния кеш,
     записан при последния УСПЕШЕН живи fetch (виж setItem по-горе). Той НЕ
     е равностоен на жив успех: маркираме го изрично с __stale, за да може
     boot() да покаже видимо предупреждение вместо тихо да го подмине като
     актуални данни. */
  try{
    var c=localStorage.getItem('katalog_cache');
    if(c){ var cached=JSON.parse(c); if(cached&&cached.items){ cached.__stale=true; return cached; } }
  }catch(e){}
  return null;
}
async function boot(){
  showLoading();
  /* Цялото стартиране е обвито: един-единствен неочакван запис (празен елемент в
     items, разместено поле, стар кеш от предишна версия на файла) хвърляше
     необработена грешка и страницата оставаше завинаги на анимацията
     „Разгръщаме каталога…“ — без съобщение и без резервен вариант. По-добре
     статичното копие с обяснение, отколкото въртящи се точки. */
  try{ await bootInner(); }
  catch(e){
    console.error('[каталог] стартирането пропадна:',e);
    try{
      D=STATIC; SHELVES=[]; setupDynamic();
      finish(STATIC_GEN,'<br><span style="color:#a0522d">Каталогът не можа да се зареди '+
        '('+esc(e&&e.message?e.message:'неизвестна грешка')+') — показва се последно запазено копие.</span>'+diagHtml());
    }catch(e2){
      /* И резервният път се счупи — поне не оставяме въртящи се точки. */
      var host=document.getElementById('katR')||document.body; /* katR е контейнерът, в който showLoading() рисува */
      host.innerHTML='<div style="padding:1rem;color:#a0522d">Каталогът не можа да се зареди. '+
        'Моля, презаредете страницата или опитайте по-късно.</div>';
    }
  }
}
async function bootInner(){
  var j=await loadLive();
  if(j&&j.items&&j.__stale){
    /* И двата живи източника паднаха, но има запазен кеш от по-раншен
       успешен fetch — показваме го, но НЕ като живи данни: ясно
       предупреждение с датата, на която кешът е бил направен (j.generated,
       записана при самото кеширане), плюс диагностиката защо живите
       източници не са отговорили. */
    D=j.items; SHELVES=(j.shelves||[]); setupDynamic();
    var genStr=(j.generated||'').split('-').reverse().join('.');
    var whenTxt=genStr?(' от '+genStr):'';
    finish(genStr||'—','<br><span style="color:#a0522d">Показват се кеширани данни'+whenTxt+' — свързаност с живите източници не бе възможна.</span>'+diagHtml());
  }
  else if(j&&j.items){ D=j.items; SHELVES=(j.shelves||[]); setupDynamic(); finish((j.generated||'').split('-').reverse().join('.'),''); }
  else{ D=STATIC; SHELVES=[]; setupDynamic(); finish(STATIC_GEN,'<br><span style="color:#a0522d">Няма връзка към живите данни в момента — показва се последно запазено копие.</span>'+diagHtml()); }
}
/* Строи изгледа от самите данни: филтрите по вид/отдел се пълнят от реално
   срещаните стойности (така публичните надписи от номенклатурите на програмата
   и всеки нов отдел се появяват сами, без да се пипа тази страница), витрините
   стават бутони, а „Нови постъпления" се смята от датата на постъпване. */
function setupDynamic(){
  /* Предварително сглобен низ за търсене на всеки запис — веднъж, не при
     всяка буква. Включва и анотацията (n) и града (c), които по-рано не
     се претърсваха. */
  D.forEach(function(i){
    i._s=[i.a,i.t,i.s,i.k,i.u,i.p,i.c,i.y,i.n,i.inv].join(' ').toLowerCase();
  });
  function rebuild(selId,allLabel){
    var sel=document.getElementById(selId),cur=sel.value,seen={},vals=[];
    D.forEach(function(i){var v=(selId==='katF'?i.v:i.o)||'';if(v&&!seen[v]){seen[v]=1;vals.push(v);}});
    vals.sort(function(a,b){return a.localeCompare(b,'bg');});
    sel.innerHTML='<option value="">'+esc(allLabel)+'</option>'+
      vals.map(function(v){return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>';}).join('');
    if(cur&&!seen[cur])sel.value='';
  }
  rebuild('katF','Всички видове');
  rebuild('katO','Всички отдели');
  /* Филтри/подредба от споделена връзка (#vid=…&otdel=…&podredba=…) се
     прилагат тук — чак след като списъците са построени от данните. */
  if(PENDF){document.getElementById('katF').value=PENDF;PENDF='';}
  if(PENDO){document.getElementById('katO').value=PENDO;PENDO='';}
  document.getElementById('katS').value=SORT;
  if(document.getElementById('katS').value!==SORT)SORT='';

  NEW_SET=new Set();
  var cutoff=new Date(); cutoff.setDate(cutoff.getDate()-NEW_DAYS);
  var cutStr=cutoff.toISOString().slice(0,10);
  D.forEach(function(i){ if(i.d&&i.d>=cutStr)NEW_SET.add(i.inv); });

  var bar=document.getElementById('katSh'),h='';
  if(NEW_SET.size){
    h+='<button class="kat-shelf-btn kat-shelf-btn-new" data-shelf="__new__">✦ Нови постъпления'+
       '<span class="kat-shelf-n">'+NEW_SET.size+'</span></button>';
  }
  var known=new Set(D.map(function(i){return i.inv;}));
  SHELVES.forEach(function(sh){
    var n=(sh.items||[]).filter(function(inv){return known.has(inv);}).length;
    if(!n)return;
    h+='<button class="kat-shelf-btn" data-shelf="'+esc(sh.name)+'">'+esc(sh.name)+
       '<span class="kat-shelf-n">'+n+'</span></button>';
  });
  if(h){
    bar.innerHTML=h; bar.style.display='flex'; bar.classList.add('kat-in');
    Array.prototype.forEach.call(bar.children,function(btn){
      btn.addEventListener('click',function(){
        var v=btn.getAttribute('data-shelf');
        SHELF=(SHELF===v)?'':v;   /* повторен клик изключва витрината */
        Array.prototype.forEach.call(bar.children,function(b2){
          b2.classList.toggle('kat-shelf-on',b2.getAttribute('data-shelf')===SHELF);
        });
        run();
      });
    });
    /* Витрина от споделена връзка (#vitrina=…) — отбелязва се активната;
       ако името вече не съществува в данните, изборът тихо отпада. */
    var shelfFound=false;
    Array.prototype.forEach.call(bar.children,function(b2){
      var on=b2.getAttribute('data-shelf')===SHELF;
      if(on)shelfFound=true;
      b2.classList.toggle('kat-shelf-on',on);
    });
    if(SHELF&&!shelfFound)SHELF='';
  } else { bar.style.display='none'; SHELF=''; }
}
/* Малка, скрита по подразбиране диагностика — вижда се само когато нещо не е наред, за да може
   администраторът на сайта да разбере кой източник е отказал и защо, без да отваря конзолата. */
function diagHtml(){
  if(!LOG.length)return '';
  var rows=LOG.map(function(l){return '<div>'+(l.ok?'✓':'✗')+' '+esc(l.label)+' — '+esc(l.detail)+'</div>';}).join('');
  return '<br><a href="#" id="katDiagA" style="color:#8b6914;text-decoration:underline;font-size:.68rem" '+
    'onclick="document.getElementById(\'katDiag\').style.display=\'block\';this.style.display=\'none\';return false">Защо? (диагностика)</a>'+
    '<div id="katDiag" style="display:none;margin-top:.5rem;font-size:.68rem;text-align:left;background:#faf7f2;'+
    'border:1px solid rgba(201,168,76,.3);padding:.6rem .8rem;max-width:420px;margin-left:auto;margin-right:auto">'+rows+
    '<div style="margin-top:.4rem"><a href="#" id="katRetryA" style="color:#8b6914;text-decoration:underline" '+
    'onclick="window.katRetry();return false">Опитай отново сега</a></div></div>';
}
function finish(gen,note){
  /* esc(gen): това беше единственото място на страницата, където стойност от
     katalog.json влиза в innerHTML без екраниране. Файлът идва от хранилището
     или от кеша в браузъра — и в двата случая не е нещо, на което страницата
     бива да се доверява сляпо. */
  document.getElementById('katFt').innerHTML=FT_BASE+'<br>Каталогът е актуален към '+esc(gen)+' · '+D.length+' записа'+note+FT_POWEREDBY;
  run();
}
/* „1 намерен запис“, „2 намерени записа“ — броячът в правилното число */
function cntTxt(n){return n===1?'1 намерен запис':n+' намерени записа';}
function run(){
  var q=document.getElementById('katQ').value.trim().toLowerCase(),
      f=document.getElementById('katF').value,o=document.getElementById('katO').value;
  /* Търсене по ДУМИ: всяка дума се търси поотделно, редът е без значение —
     „вазов иван" намира „Иван Вазов и неговите близки". Претърсва и
     анотацията и града (виж _s в setupDynamic). */
  QW=q?q.split(/\s+/).filter(Boolean):[];
  var shelfSet=null;
  if(SHELF==='__new__')shelfSet=NEW_SET;
  else if(SHELF){
    var sh=null;
    for(var si=0;si<SHELVES.length;si++)if(SHELVES[si].name===SHELF){sh=SHELVES[si];break;}
    shelfSet=new Set(sh?(sh.items||[]):[]);
  }
  R=D.filter(function(i){
    if(shelfSet&&!shelfSet.has(i.inv))return false;
    if(f&&i.v!==f)return false; if(o&&i.o!==o)return false;
    if(!QW.length)return true;
    var s=i._s!=null?i._s:(i._s=[i.a,i.t,i.s,i.k,i.u,i.p,i.c,i.y,i.n,i.inv].join(' ').toLowerCase());
    for(var w=0;w<QW.length;w++)if(s.indexOf(QW[w])<0)return false;
    return true;
  });
  /* В изгледа „Нови постъпления" най-скорошните застават отгоре (освен ако
     не е избрана изрична подредба) */
  if(SHELF==='__new__'&&!SORT)R=R.slice().sort(function(a,b){return (b.d||'')<(a.d||'')?-1:1;});
  if(SORT){
    R=R.slice();
    if(SORT==='a')R.sort(function(a,b){return String(a.a||'￿').localeCompare(String(b.a||'￿'),'bg');});
    else if(SORT==='t')R.sort(function(a,b){return String(a.t||'').localeCompare(String(b.t||''),'bg');});
    else if(SORT==='y1')R.sort(function(a,b){return String(b.y||'')<String(a.y||'')?-1:1;});
    else if(SORT==='y0')R.sort(function(a,b){return String(a.y||'￿')<String(b.y||'￿')?-1:1;});
    else if(SORT==='inv')R.sort(function(a,b){return (a.inv||0)-(b.inv||0);});
  }
  writeHash();
  var hasActive=!!(QW.length||f||o||SHELF||SORT);
  document.getElementById('katX').classList.toggle('kat-clear-on',hasActive);
  P=0;document.getElementById('katR').innerHTML='';
  document.getElementById('katC').textContent=cntTxt(R.length)+
    (SHELF?(' · '+(SHELF==='__new__'?'нови постъпления':'витрина „'+SHELF+'“')):'');

  if(!R.length){
    document.getElementById('katM').style.display='none';
    document.getElementById('katR').innerHTML=
      '<div class="kat-empty">'+
        '<span class="kat-empty-ico">🔍</span>'+
        '<div class="kat-empty-t">Няма намерени записи</div>'+
        '<div class="kat-empty-d">Опитайте с друга дума, по-кратко търсене или премахнете някой от филтрите по вид и отдел.</div>'+
        (hasActive?'<button class="kat-more" id="katXe" type="button" style="margin-top:1.4rem">Изчисти търсенето и филтрите</button>':'')+
      '</div>';
    return;
  }
  page();
  revealShared();
}
/* Изчистване на всичко активно — от бутона „Изчисти" и от празния екран */
function clearAll(){
  document.getElementById('katQ').value='';
  document.getElementById('katF').value='';
  document.getElementById('katO').value='';
  document.getElementById('katS').value='';
  SORT='';SHELF='';
  var bar=document.getElementById('katSh');
  Array.prototype.forEach.call(bar.children,function(b2){b2.classList.remove('kat-shelf-on');});
  run();
}
/* Споделена връзка към конкретен запис (#zapis=инв№): дозарежда страници,
   докато записът се покаже, разгъва го и го поставя в средата на екрана. */
function revealShared(){
  if(ZAPIS==null)return;
  var target=String(ZAPIS); ZAPIS=null;
  var idx=-1;
  for(var i=0;i<R.length;i++)if(String(R[i].inv)===target){idx=i;break;}
  if(idx<0)return;
  while(P<=idx&&P<R.length)page();
  // CSS.escape (v2.4.27): стойността идва от адреса (#zapis=…) и кавичка в нея
  // хвърляше от querySelector, което падаше в общия catch и заменяше живия
  // каталог с трите демонстрационни записа.
  var safeTarget=(window.CSS&&CSS.escape)?CSS.escape(target):String(target).replace(/["\\]/g,'\\$&');
  var el=document.querySelector('#katR .kat-item[data-inv="'+safeTarget+'"]');
  if(el){
    el.classList.add('kat-open','kat-item-in');
    el.setAttribute('aria-expanded','true');
    setTimeout(function(){el.scrollIntoView({block:'center',behavior:'smooth'});},120);
  }
}
/* Открояване на думите от търсенето в текста — безопасно: неоткроените
   части минават през esc(), откроените също, чак после се сглобяват. */
function hl(s){
  s=String(s==null?'':s);
  if(!QW.length||!s)return esc(s);
  var low=s.toLowerCase(),marks=[];
  QW.forEach(function(w){
    var p=0;
    while((p=low.indexOf(w,p))>-1){marks.push([p,p+w.length]);p+=1;}
  });
  if(!marks.length)return esc(s);
  marks.sort(function(a,b){return a[0]-b[0];});
  var merged=[];
  marks.forEach(function(m){
    var l=merged[merged.length-1];
    if(l&&m[0]<=l[1])l[1]=Math.max(l[1],m[1]);
    else merged.push(m.slice());
  });
  var out='',pos=0;
  merged.forEach(function(m){
    out+=esc(s.slice(pos,m[0]))+'<mark class="kat-hl">'+esc(s.slice(m[0],m[1]))+'</mark>';
    pos=m[1];
  });
  return out+esc(s.slice(pos));
}
function page(){
  var s=R.slice(P,P+50),h='';
  s.forEach(function(i){
    /* Корица, а при липса — визуален заместител с първата буква на заглавието,
       за да останат всички редове подравнени и завършени на вид */
    var cover;
    if(i.cv){
      cover='<div class="kat-cover-box"><img class="kat-cover" src="'+esc(i.cv)+'" alt="'+esc(i.t)+'" loading="lazy"></div>';
    }else{
      var letter=(String(i.t||'?').trim().charAt(0)||'?').toUpperCase();
      cover='<div class="kat-cover-box"><div class="kat-ph">'+
            '<span class="kat-ph-letter">'+esc(letter)+'</span>'+
            '<span class="kat-ph-lbl">'+esc(i.v||'запис')+'</span></div></div>';
    }

    var pub=[i.c,i.p,i.y].filter(Boolean).join(', ');

    var chips='';
    chips+='<span class="kat-chip">инв. '+esc(i.inv)+'</span>';
    if(i.u) chips+='<span class="kat-chip">УДК '+esc(i.u)+'</span>';
    if(i.g) chips+='<span class="kat-chip">'+esc(i.g)+'</span>';
    if(i.o) chips+='<span class="kat-chip">'+esc(i.o)+'</span>';

    /* Разгънат изглед (клик върху реда): пълната анотация и данните, които
       не се събират в краткия ред, плюс връзка за споделяне на записа. */
    var xrows='';
    if(i.n)xrows+='<div>'+hl(i.n)+'</div>';
    var facts=[];
    if(i.l)facts.push('<b>Език:</b> '+esc(i.l));
    if(i.v)facts.push('<b>Вид:</b> '+esc(i.v));
    if(i.k)facts.push('<b>Ключови думи:</b> '+hl(i.k));
    if(i.d)facts.push('<b>Постъпила:</b> '+esc(String(i.d).split('-').reverse().join('.')));
    if(facts.length)xrows+='<div style="margin-top:.35rem">'+facts.join(' · ')+'</div>';
    xrows+='<button class="kat-copy" type="button" data-copy="'+esc(i.inv)+'">Копирай връзка към записа</button>';

    h+='<div class="kat-item" data-inv="'+esc(i.inv)+'" tabindex="0" role="button" aria-expanded="false">'+cover+
    '<div class="kat-item-body">'+
      '<h2>'+hl(i.t)+'</h2>'+
      (i.a||i.s ? '<div class="kat-m kat-m-author">'+hl(i.a||'')+(i.s?' — '+hl(i.s):'')+'</div>' : '')+
      (pub ? '<div class="kat-m kat-m-pub">'+hl(pub)+'</div>' : '')+
      (i.n?'<div class="kat-note">'+hl(String(i.n).slice(0,220))+(String(i.n).length>220?'…':'')+'</div>':'')+
      '<div class="kat-meta-row">'+
        '<span class="kat-av '+(i.av?'kat-y':'kat-n')+'">'+(i.av?'налична':'заета')+'</span>'+
        (NEW_SET&&NEW_SET.has(i.inv)?'<span class="kat-new-badge">нова</span>':'')+
        chips+
      '</div>'+
      '<div class="kat-x">'+xrows+'</div>'+
    '</div></div>';
  });

  var container=document.getElementById('katR');
  var firstNew=container.children.length;
  container.insertAdjacentHTML('beforeend',h);

  /* Плавна поява на новодобавените редове (ограничен stagger, за да не се бави дълъг списък) */
  var added=Array.prototype.slice.call(container.children,firstNew);
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  added.forEach(function(el,idx){
    if(reduce){ el.classList.add('kat-item-in'); return; }
    setTimeout(function(){ el.classList.add('kat-item-in'); }, Math.min(idx,14)*45);
  });

  P+=50;
  document.getElementById('katM').style.display=P<R.length?'block':'none';
}
/* Дребна поправка (Фаза 2): търсенето филтрираше D и пренаписваше целия
   резултатен списък при ВСЯКА буквичка — забележимо при по-голям каталог.
   150ms debounce чака кратка пауза в писането, преди да филтрира. */
function katDebounce(fn,ms){var t=null;return function(){clearTimeout(t);t=setTimeout(fn,ms);};}
document.getElementById('katQ').addEventListener('input',katDebounce(run,150));
document.getElementById('katF').addEventListener('change',run);
document.getElementById('katO').addEventListener('change',run);
document.getElementById('katS').addEventListener('change',function(){SORT=this.value;run();});
document.getElementById('katX').addEventListener('click',clearAll);
document.getElementById('katM').addEventListener('click',page);
/* Автоматично дозареждане: когато „Покажи още" наближи екрана, страницата
   се зарежда сама — бутонът остава като резервен път за стари браузъри. */
if('IntersectionObserver' in window){
  var katMoreIo=new IntersectionObserver(function(es){
    es.forEach(function(en){
      var btn=document.getElementById('katM');
      if(en.isIntersecting&&btn.style.display!=='none')page();
    });
  },{rootMargin:'500px 0px'});
  katMoreIo.observe(document.getElementById('katM'));
}
/* Плаващ бутон „към началото" при по-дълго превъртане */
var katTop=document.createElement('button');
katTop.className='kat-top';katTop.type='button';katTop.textContent='↑';
katTop.setAttribute('aria-label','Към началото на страницата');katTop.title='Към началото';
document.body.appendChild(katTop);
katTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
window.addEventListener('scroll',function(){
  katTop.classList.toggle('kat-top-on',window.scrollY>900);
},{passive:true});
/* Копиране на връзка към конкретен запис */
function katRecordUrl(inv){
  return location.origin+location.pathname+location.search+'#zapis='+encodeURIComponent(inv);
}
function katCopy(btn,inv){
  var url=katRecordUrl(inv),old=btn.textContent;
  function done(okTxt){btn.textContent=okTxt;setTimeout(function(){btn.textContent=old;},1600);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){done('✓ Копирана');},function(){fallback();});
  }else fallback();
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=url;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done('✓ Копирана');}catch(e){done(url);}
    ta.remove();
  }
}
/* Разгъване на запис с клавиатура (Enter/интервал) — редовете са фокусируеми */
document.getElementById('katR').addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var item=e.target&&e.target.closest?e.target.closest('.kat-item'):null;
  if(!item||e.target.closest('.kat-copy'))return;
  e.preventDefault();
  item.classList.toggle('kat-open');
  item.setAttribute('aria-expanded',item.classList.contains('kat-open')?'true':'false');
});

/* Уголемяване на корицата на цял екран при клик върху нея */
var katLb=document.createElement('div');
katLb.className='kat-lightbox'; katLb.id='katLb';
katLb.innerHTML='<button class="kat-lb-close" id="katLbClose" aria-label="Затвори">&times;</button><img id="katLbImg" src="" alt="">';
document.body.appendChild(katLb);
var katLbPrevFocus=null;
function katLbOpen(src,alt){
  document.getElementById('katLbImg').src=src;
  document.getElementById('katLbImg').alt=alt||'';
  katLb.classList.add('kat-lb-open');
  document.addEventListener('keydown',katLbEsc);
  /* Достъпност: фокусът влиза в лайтбокса и се връща там, откъдето е дошъл */
  katLbPrevFocus=document.activeElement;
  document.getElementById('katLbClose').focus();
}
function katLbClose(){
  katLb.classList.remove('kat-lb-open');
  document.removeEventListener('keydown',katLbEsc);
  if(katLbPrevFocus&&katLbPrevFocus.focus){try{katLbPrevFocus.focus();}catch(e){}}
  katLbPrevFocus=null;
}
function katLbEsc(e){ if(e.key==='Escape')katLbClose(); }
katLb.addEventListener('click',function(e){ if(e.target===katLb||e.target.id==='katLbClose')katLbClose(); });
document.getElementById('katR').addEventListener('click',function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains('kat-cover')){
    katLbOpen(t.src,t.alt);
    return; /* корицата отваря лайтбокса, не разгъва записа */
  }
  var copyBtn=t&&t.closest?t.closest('.kat-copy'):null;
  if(copyBtn){katCopy(copyBtn,copyBtn.getAttribute('data-copy'));return;}
  var xeBtn=t&&t.id==='katXe';
  if(xeBtn){clearAll();return;}
  var item=t&&t.closest?t.closest('.kat-item'):null;
  if(item){
    item.classList.toggle('kat-open');
    item.setAttribute('aria-expanded',item.classList.contains('kat-open')?'true':'false');
  }
});
/* inline onclick="" в диагностиката изпълнява в глобален контекст, не вътре в тази затворена
   функция (IIFE) — затова презареждането се излага изрично тук, вместо да разчита на локалното име. */
window.katRetry=boot;
readHash(); /* търсене/филтри/витрина/запис от споделена връзка — преди първото зареждане */
boot();

/* Reveal при поява — в стила на останалите страници на сайта */
if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.querySelectorAll('.kat-r').forEach(function(el){ el.classList.add('kat-in'); });
} else if('IntersectionObserver' in window){
  var katIo=new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('kat-in'); katIo.unobserve(e.target); } });
  },{threshold:.12});
  document.querySelectorAll('.kat-r').forEach(function(el){ katIo.observe(el); });
} else {
  document.querySelectorAll('.kat-r').forEach(function(el){ el.classList.add('kat-in'); });
}
})();
</script>
