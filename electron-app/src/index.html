<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<!-- img-src допуска data: заради логото на организацията, което се пази в базата
     данни като data URI. Външни адреси нарочно не се допускат — програмата не
     зарежда изображения от интернет.
     script-src/style-src 'unsafe-inline' остават засега — целият интерфейс е
     изграден с onclick="…" атрибути и style="…" в динамично генериран HTML
     (стотици места из app.js); премахването им изисква истински рефакторинг на
     ввръзването на събития (следваща фаза от плана), не точкова поправка тук.
     Добавени са обаче object-src/base-uri/form-action — не изискват промяна в
     кода (формите тук никога реално не се "submit"-ват, няма <object>/<base>),
     а затварят реални пътища за инжекция дори без да пипаме script-src. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>InvLib · Библиотечна система</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="rail">
      <div class="brand">
        <img class="brandIcon" src="assets/brand-icon.png" alt="InvLib">
        <div class="brandMark">
          <div class="brandName" id="brandName">…</div>
        </div>
        <div class="brandSub" id="brandSub">…</div>
      </div>
      <nav id="nav"></nav>
      <div class="railFoot">
        <div id="savedIndicator" class="savedIndicator"></div>
        <div id="appCredit" class="appCredit"></div>
      </div>
    </aside>
    <main id="main">
      <header id="topbar">
        <div>
          <h1 id="vTitle">Табло</h1>
          <div id="vSub" class="sub">обобщение на състоянието</div>
        </div>
        <!-- Логото на InvLib, центрирано в горната лента. alt="" нарочно:
             украса е, а името на програмата вече се обявява веднъж от
             иконата в лентата вляво — не бива да се чете два пъти. -->
        <img class="topbarLogo" src="assets/brand-lockup.png" alt="">
        <div class="topRight">
          <div id="topActions"></div>
          <!-- Изборът на служител стои горе вдясно: той се сменя през деня и е
               по-подръка тук, отколкото в дъното на страничната лента. -->
          <button id="userBadge" class="userBadge" onclick="chooseEmployeeModal()">Служител: (изберете)</button>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <div id="veil" class="veil">
    <div id="modal" class="modal"></div>
  </div>
  <!-- Втори слой: помощни прозорци (напр. изборът на УДК), които се отварят
       ВЪРХУ вече отворена форма, без да я затварят. -->
  <div id="veil2" class="veil veil2">
    <div id="modal2" class="modal"></div>
  </div>
  <!-- Слой на въпросите (askConfirm, v2.4.33) — над двата слоя прозорци и над
       прегледа преди печат, за да не изтрива формата, от която е зададен въпросът. -->
  <div id="veilC" class="veil veilC">
    <div id="modalC" class="modal cfm"></div>
  </div>
  <!-- Съобщения: успехите долу вдясно (polite), грешките горе в центъра
       (assertive) — вижте toast() в views/core.js. -->
  <div id="toasts" aria-live="polite"></div>
  <div id="toastsTop" aria-live="assertive"></div>

  <!-- Преглед преди печат (v1.71.0). Системният печатен диалог на Windows не
       може да визуализира съдържанието на Electron прозорец („Това приложение
       не поддържа визуализация на печата“), затова документът се показва ТУК,
       на екрана, преди изобщо да се стигне до window.print(). Всички печатни
       пътища минават през doPrint() в views/core.js, който отваря този слой. -->
  <div id="printPreview" role="dialog" aria-modal="true" aria-label="Преглед преди печат">
    <div class="ppBox">
      <header class="ppHead">
        <h2 id="ppTitle">Преглед преди печат</h2>
        <span class="ppZoom" role="group" aria-label="Мащаб на прегледа">
          <button class="btn sm" onclick="ppZoom(-1)" title="Намаляване" aria-label="Намаляване">−</button>
          <button class="btn sm" id="ppZoomPct" onclick="ppZoom('fit')" title="Побиране по ширината на прозореца">100%</button>
          <button class="btn sm" onclick="ppZoom(1)" title="Уголемяване" aria-label="Уголемяване">+</button>
        </span>
        <button class="x" onclick="ppClose()" title="Затвори" aria-label="Затвори">&times;</button>
      </header>
      <div class="ppScroll"><div id="ppSheet"></div></div>
      <footer class="ppFoot">
        <span class="hint" id="ppHint"></span>
        <button class="btn" onclick="ppClose()">Отказ</button>
        <button class="btn" id="ppPdfBtn" onclick="ppSavePdf()">Запази PDF…</button>
        <button class="btn pri" onclick="ppPrint()">Печат…</button>
      </footer>
    </div>
  </div>
  <div id="printArea"></div>

  <script src="udk.js"></script>
  <!-- app.js (Фаза 4/5-продължение: разбиване по домейни, вижте
       docs/ARCHITECTURE.md) е разделен на src/views/*.js — по един файл на
       раздел от интерфейса, огледално на handlers/*.js в главния процес.
       Редът тук има значение само за views/bootstrap.js, който ТРЯБВА да е
       последен (вижте обяснителния коментар в началото на самия файл);
       редът между всички останали view-файлове е без значение — никой от
       тях не чете чужда функция/променлива на ниво скрипт веднага при
       зареждане, само отвътре на функции, извиквани по-късно. -->
  <script src="views/core.js"></script>
  <script src="views/navigation.js"></script>
  <script src="views/employee-badge.js"></script>
  <script src="views/auto-update.js"></script>
  <script src="views/dashboard.js"></script>
  <script src="views/categories.js"></script>
  <script src="views/books.js"></script>
  <script src="views/notices.js"></script>
  <script src="views/authorities.js"></script>
  <script src="views/inv-book.js"></script>
  <script src="views/kdbf.js"></script>
  <script src="views/acquisitions.js"></script>
  <script src="views/deaccession-acts.js"></script>
  <script src="views/readers.js"></script>
  <script src="views/account.js"></script>
  <script src="views/suggestions.js"></script>
  <script src="views/loans.js"></script>
  <script src="views/housebound.js"></script>
  <script src="views/holds.js"></script>
  <script src="views/overdue.js"></script>
  <script src="views/inventory-sessions.js"></script>
  <script src="views/periodicals.js"></script>
  <script src="views/mzs.js"></script>
  <script src="views/dnevnik.js"></script>
  <script src="views/stats.js"></script>
  <script src="views/reports.js"></script>
  <script src="views/catalog.js"></script>
  <script src="views/barcode-labels.js"></script>
  <script src="views/logo-org.js"></script>
  <script src="views/audit.js"></script>
  <script src="views/settings.js"></script>
  <script src="views/analytics.js"></script>
  <script src="views/persons.js"></script>
  <script src="views/chronicle.js"></script>
  <script src="views/links.js"></script>
  <script src="views/av.js"></script>
  <script src="views/data-import.js"></script>
  <script src="views/mobile.js"></script>
  <script src="views/bootstrap.js"></script>
</body>
</html>
