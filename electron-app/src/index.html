<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Инвентар · Библиотечна система</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="rail">
      <div class="brand">
        <div class="brandTitle">Инвентар</div>
        <div class="brandTagline">Библиотечна система</div>
        <div class="brandSub" id="brandSub">…</div>
      </div>
      <nav id="nav"></nav>
      <div class="railFoot">
        <button id="userBadge" class="userBadge" onclick="setCurrentUser()">Служител: (задайте име)</button>
        <div id="appCredit" class="appCredit"></div>
      </div>
    </aside>
    <main id="main">
      <header id="topbar">
        <div>
          <h1 id="vTitle">Табло</h1>
          <div id="vSub" class="sub">обобщение на състоянието</div>
        </div>
        <div id="topActions"></div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <div id="veil" class="veil">
    <div id="modal" class="modal"></div>
  </div>
  <div id="toasts"></div>
  <div id="printArea"></div>

  <script src="app.js"></script>
</body>
</html>
